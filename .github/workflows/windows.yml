name: Build Yapfast (Windows)

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/windows.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "nix/**"
      - "scripts/**"
      - "vendor/**"
      - "src/**"
      - "ui/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yapfast-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 (cross-compile with Nix)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout patched code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Cache prepared Windows Skia
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Windows ZIP with the supported project toolchain
        run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: yapfast-windows-x64
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
