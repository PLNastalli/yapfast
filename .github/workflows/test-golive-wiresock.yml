name: Windows Go Live WireSock launcher

on:
  pull_request:
    paths:
      - "scripts/launch-golive-wiresock.ps1"
      - "scripts/install-golive-default-shortcut.ps1"
      - "scripts/install-golive-all.ps1"
      - ".github/workflows/test-golive-wiresock.yml"
  workflow_dispatch:

jobs:
  validate-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\launch-golive-wiresock.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          $shortcutScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\install-golive-default-shortcut.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($shortcutScript, [ref]$tokens, [ref]$errors) | Out-Null
          $allScript = Join-Path $env:GITHUB_WORKSPACE 'scripts\install-golive-all.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($allScript, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell syntax check failed.'
          }
      - name: Shortcut can be installed before VPN profile exists
        shell: powershell
        run: |
          $testDir = Join-Path $env:RUNNER_TEMP 'golive-shortcut-tests'
          New-Item -Path $testDir -ItemType Directory -Force | Out-Null
          $fakeExe = Join-Path $testDir 'yapfast.exe'
          New-Item -Path $fakeExe -ItemType File -Force | Out-Null
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'scripts\launch-golive-wiresock.ps1'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'scripts\install-golive-default-shortcut.ps1'
          $missingProfile = Join-Path $testDir 'vpn.conf'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Yapfast GoLive.lnk'
          try {
            & $setup -Launcher $launcher -WireGuardConfig $missingProfile -YapfastExe $fakeExe
            if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
              throw 'Shortcut was not created without vpn.conf.'
            }
            $shell = New-Object -ComObject WScript.Shell
            $target = $shell.CreateShortcut($shortcut)
            if ($target.TargetPath -notmatch 'wscript\\.exe
      - name: Validate positive and negative profiles without connecting
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'golive-wiresock-tests'
          New-Item -Path $folder -ItemType Directory -Force | Out-Null
          $app = Join-Path $folder 'yapfast.exe'
          $cli = Join-Path $folder 'wiresock-client.exe'
          New-Item -Path $app, $cli -ItemType File -Force | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\launch-golive-wiresock.ps1'
          $good = Join-Path $folder 'full-tunnel.conf'
          @(
            '[Interface]',
            'PrivateKey = test-only',
            'Address = 10.55.0.2/32',
            'DNS = 1.1.1.1',
            '[Peer]',
            'PublicKey = test-only',
            'AllowedIPs = 0.0.0.0/0, ::/0',
            'Endpoint = 203.0.113.1:51820'
          ) | Set-Content -Path $good -Encoding Ascii
          & powershell.exe -NoProfile -File $script -WireGuardConfig $good -YapfastExe $app -WireSockExe $cli -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'A valid profile was rejected.' }
          # MediaOnly must validate without starting WireSock or copying binaries.
          $mediaOutput = & powershell.exe -NoProfile -File $script -WireGuardConfig $good -YapfastExe $app -WireSockExe $cli -MediaOnly -CheckOnly | Out-String
          if ($mediaOutput -notmatch 'media worker only' -or $mediaOutput -notmatch 'Profile validation succeeded') {
            throw 'The MediaOnly configuration did not validate.'
          }
          if (@(Get-ChildItem $folder -Filter 'yapfast-golive-media-*.exe').Count -ne 0) {
            throw 'CheckOnly created a media worker executable.'
          }
          # Verify auto-discovery of the common WireSock Secure Connect/bin path.
          $realProgramFiles = $env:ProgramFiles
          try {
            $env:ProgramFiles = Join-Path $folder 'Program Files'
            $bin = Join-Path $env:ProgramFiles 'WireSock Secure Connect\bin'
            New-Item -ItemType Directory -Path $bin -Force | Out-Null
            Copy-Item -Path $cli -Destination (Join-Path $bin 'wiresock-client.exe')
            # Invoke in this PowerShell process, preserving its temporary
            # ProgramFiles override. An unresolved CLI path throws.
            & $script -WireGuardConfig $good -YapfastExe $app -CheckOnly
          } finally {
            $env:ProgramFiles = $realProgramFiles
          }

          $bad = Join-Path $folder 'not-full-tunnel.conf'
          (Get-Content -Path $good) -replace '0.0.0.0/0, ::/0', '10.0.0.0/8' |
            Set-Content -Path $bad -Encoding Ascii
          $originalPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & powershell.exe -NoProfile -File $script -WireGuardConfig $bad -YapfastExe $app -WireSockExe $cli -CheckOnly 2>&1 | Out-Null
            $badExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $originalPreference
          }
          if ($badExitCode -eq 0) { throw 'A profile without a default route was accepted.' }
          # GitHub's PowerShell runner exits with LASTEXITCODE if left nonzero.
          $global:LASTEXITCODE = 0
) {
              throw 'Shortcut does not use the hidden Windows Script Host.'
            }
            if ($target.Arguments -notmatch 'launch-golive-hidden\\.vbs') {
              throw 'Shortcut does not point to the hidden launcher.'
            }
            $hiddenScript = Join-Path (Split-Path $launcher -Parent) 'launch-golive-hidden.vbs'
            if (-not (Test-Path -LiteralPath $hiddenScript)) {
              throw 'The hidden launcher was not created.'
            }
            $hiddenContent = Get-Content -LiteralPath $hiddenScript -Raw
            if ($hiddenContent -notmatch 'MediaOnly' -or $hiddenContent -notmatch 'vpn.conf' -or $hiddenContent -notmatch 'WindowStyle Hidden') {
              throw 'Hidden launcher did not preserve the media-only mode and VPN path.'
            }
          } finally {
            & $setup -Remove
          }
      - name: Validate positive and negative profiles without connecting
        shell: powershell
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'golive-wiresock-tests'
          New-Item -Path $folder -ItemType Directory -Force | Out-Null
          $app = Join-Path $folder 'yapfast.exe'
          $cli = Join-Path $folder 'wiresock-client.exe'
          New-Item -Path $app, $cli -ItemType File -Force | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts\launch-golive-wiresock.ps1'
          $good = Join-Path $folder 'full-tunnel.conf'
          @(
            '[Interface]',
            'PrivateKey = test-only',
            'Address = 10.55.0.2/32',
            'DNS = 1.1.1.1',
            '[Peer]',
            'PublicKey = test-only',
            'AllowedIPs = 0.0.0.0/0, ::/0',
            'Endpoint = 203.0.113.1:51820'
          ) | Set-Content -Path $good -Encoding Ascii
          & powershell.exe -NoProfile -File $script -WireGuardConfig $good -YapfastExe $app -WireSockExe $cli -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'A valid profile was rejected.' }
          # MediaOnly must validate without starting WireSock or copying binaries.
          $mediaOutput = & powershell.exe -NoProfile -File $script -WireGuardConfig $good -YapfastExe $app -WireSockExe $cli -MediaOnly -CheckOnly | Out-String
          if ($mediaOutput -notmatch 'media worker only' -or $mediaOutput -notmatch 'Profile validation succeeded') {
            throw 'The MediaOnly configuration did not validate.'
          }
          if (@(Get-ChildItem $folder -Filter 'yapfast-golive-media-*.exe').Count -ne 0) {
            throw 'CheckOnly created a media worker executable.'
          }
          # Verify auto-discovery of the common WireSock Secure Connect/bin path.
          $realProgramFiles = $env:ProgramFiles
          try {
            $env:ProgramFiles = Join-Path $folder 'Program Files'
            $bin = Join-Path $env:ProgramFiles 'WireSock Secure Connect\bin'
            New-Item -ItemType Directory -Path $bin -Force | Out-Null
            Copy-Item -Path $cli -Destination (Join-Path $bin 'wiresock-client.exe')
            # Invoke in this PowerShell process, preserving its temporary
            # ProgramFiles override. An unresolved CLI path throws.
            & $script -WireGuardConfig $good -YapfastExe $app -CheckOnly
          } finally {
            $env:ProgramFiles = $realProgramFiles
          }

          $bad = Join-Path $folder 'not-full-tunnel.conf'
          (Get-Content -Path $good) -replace '0.0.0.0/0, ::/0', '10.0.0.0/8' |
            Set-Content -Path $bad -Encoding Ascii
          $originalPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & powershell.exe -NoProfile -File $script -WireGuardConfig $bad -YapfastExe $app -WireSockExe $cli -CheckOnly 2>&1 | Out-Null
            $badExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $originalPreference
          }
          if ($badExitCode -eq 0) { throw 'A profile without a default route was accepted.' }
          # GitHub's PowerShell runner exits with LASTEXITCODE if left nonzero.
          $global:LASTEXITCODE = 0
